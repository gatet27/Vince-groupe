}else{
 if(k==='astro')back=`<circle cx="50" cy="55" r="43" fill="#fffdf3"/><circle cx="50" cy="55" r="35" fill="#9ecbfc"/>`;
 if(k==='robot')extra=`<rect x="20" y="22" width="60" height="64" rx="18" fill="${face}"/><path d="M50 22V12" stroke="#6c7b90" stroke-width="5"/><circle cx="50" cy="11" r="7" fill="#f36f5c"/>`;
 if(k==='alien')back=`<path d="M18 55 Q15 16 50 22 Q85 16 82 55 L72 80 Q50 97 28 80Z" fill="${face}"/>`;
 if(['girl','boy','artist'].includes(k))back='';
}
let head=['robot','alien'].includes(k)?'':`<circle cx="50" cy="57" r="33" fill="${face}"/>`;
if(k==='robot')head='';
let eyes= k==='panda'?`<circle cx="37" cy="59" r="4" fill="white"/><circle cx="63" cy="59" r="4" fill="white"/>`:`<ellipse cx="38" cy="${eyeY}" rx="4.1" ry="5.5" fill="#20252c"/><ellipse cx="62" cy="${eyeY}" rx="4.1" ry="5.5" fill="#20252c"/><circle cx="39.5" cy="${eyeY-2}" r="1.4" fill="white"/><circle cx="63.5" cy="${eyeY-2}" r="1.4" fill="white"/>`;
if(k==='alien')eyes=`<ellipse cx="36" cy="59" rx="9" ry="12" fill="#263d60" transform="rotate(-12 36 59)"/><ellipse cx="64" cy="59" rx="9" ry="12" fill="#263d60" transform="rotate(12 64 59)"/><ellipse cx="34" cy="55" rx="2.5" ry="4" fill="white"/><ellipse cx="62" cy="55" rx="2.5" ry="4" fill="white"/>`;
let mouth=k==='robot'?'<rect x="38" y="72" width="24" height="6" rx="3" fill="#344456"/>':k==='fox'||k==='panda'||k==='bear'||k==='cat'?`<ellipse cx="50" cy="71" rx="6" ry="4" fill="#36363b"/><path d="M40 77 Q50 84 60 77" stroke="#34343a" stroke-width="2" fill="none" stroke-linecap="round"/>`:'<path d="M39 73 Q50 84 61 73" stroke="#383135" stroke-width="3.3" fill="none" stroke-linecap="round"/>';
let blush='<circle cx="28" cy="69" r="5" fill="#f16d7b" opacity=".34"/><circle cx="72" cy="69" r="5" fill="#f16d7b" opacity=".34"/>';
let front=['girl','boy','artist'].includes(k)?hair[k]:'';
return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-label="${esc(c.label)}" role="img" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="p${id}"><circle cx="50" cy="50" r="50"/></clipPath></defs><g clip-path="url(#p${id})"><circle cx="50" cy="50" r="50" fill="${c.bg}"/><circle cx="77" cy="16" r="26" fill="#ffffff" opacity=".18"/><ellipse cx="50" cy="108" rx="43" ry="38" fill="${c.shirt}"/>${back}${head}${extra}${front}${blush}${eyes}${mouth}</g></svg>`}
function peopleIllustration(ids){const arr=ids||[0,4,5,6];return `<svg viewBox="0 0 430 360" aria-hidden="true"><ellipse cx="220" cy="306" rx="172" ry="24" fill="#9d7d17" opacity=".12"/>${arr.map((id,i)=>{let pts=[[62,125],[171,64],[275,137],[206,213]],p=pts[i%4],r=i===1?104:95;return `<g transform="translate(${p[0]},${p[1]}) rotate(${[-15,8,13,-7][i%4]})"><circle cx="${r/2}" cy="${r/2}" r="${r/2+7}" fill="#fff4b8" opacity=".75"/>${avatarSVG(id,r).replace(/width="\d+" height="\d+"/,'x="0" y="0" width="'+r+'" height="'+r+'"')}</g>`}).join('')}<path d="M49 92 l8 -20 9 20 20 9 -20 9 -9 20 -8 -20 -20 -9Z" fill="#fff8c7" opacity=".9"/><path d="M335 62 l5 -13 6 13 12 5 -12 6 -6 12 -5 -12 -13 -6Z" fill="#fff8c7" opacity=".9"/><circle cx="388" cy="212" r="10" fill="#fff7b0"/><circle cx="23" cy="247" r="8" fill="#fff7b0"/></svg>`}
function showHome(){stopPoll();state.view='home';shell(`<main class="home"><section class="panel option"><div class="option-illustration">${peopleIllustration([10,7,5,1])}</div><button class="sunbtn" onclick="startJoin()">Rejoindre le groupe</button></section><section class="panel option"><div class="option-illustration">${peopleIllustration([3,0,4])}</div><button class="sunbtn" onclick="startCreate()">Nouveau groupe</button></section></main>`)}
function setUrl(q){try{const dest=location.pathname+(q?'?'+q:'');history.pushState({},'',dest)}catch{ /* navigation de prévisualisation hors site HTTPS */ }}
function startCreate(){stopPoll();state.name='';state.avatar=0;state.view='create';setUrl('mode=create');showProfile()}
function startJoin(code=''){stopPoll();state.view='join';state.entry=code;state.invalid=false;state.checking=false;state.error='';if(!code)setUrl('mode=join');showJoin();if(code.length===6)verifyCode()}
function goBack(){if(state.view==='profile-join'){startJoin(state.code||'')}else{setUrl('');showHome()}}
function showProfile(){const joining=state.view==='profile-join';let title=joining?'Sélectionne ton avatar':'Crée ton personnage';let submit=joining?'Rejoindre ce groupe':'Créer mon groupe';shell(`<main class="two-layout"><section class="panel left-panel profile-panel"><h1 class="section-title">${title}</h1><label class="name-field" for="nickname">Ton prénom ou pseudo</label><input id="nickname" class="name-input" maxlength="20" spellcheck="false" autocomplete="nickname" placeholder="Comment tu t’appelles ?" value="${esc(state.name)}" oninput="updateName(this.value)"/><p class="name-field" style="text-align:center;margin-top:17px">Choisis ton avatar</p><div class="avatar-grid">${avatars.map((c,i)=>`<button class="avatar-choice ${i===state.avatar?'selected':''}" data-avatar="${i}" onclick="selectAvatar(${i})" aria-label="${esc(c.label)}" aria-pressed="${i===state.avatar}">${avatarSVG(i,112)}${i===state.avatar?'<span class="check">✓</span>':''}</button>`).join('')}</div><div class="panel-bottom"><p id="profile-error" class="error-block">${esc(state.error)}</p><button id="submit-profile" class="sunbtn" style="width:100%;" onclick="submitProfile()">${submit}</button></div></section><aside class="right-stage"><div class="right-content"><div class="profile-label" id="profile-label">${esc(state.name||avatars[state.avatar].label)}</div><div class="profile-image" id="profile-large">${avatarSVG(state.avatar,440)}</div></div></aside></main>`);}
function updateName(v){state.name=normName(v);document.getElementById('profile-label').textContent=state.name||avatars[state.avatar].label}
function selectAvatar(i){state.avatar=i;document.querySelectorAll('[data-avatar]').forEach(b=>{const on=+b.dataset.avatar===i;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on));b.querySelector('.check')?.remove();if(on)b.insertAdjacentHTML('beforeend','<span class="check">✓</span>')});document.getElementById('profile-large').innerHTML=avatarSVG(i,440);document.getElementById('profile-label').textContent=state.name||avatars[i].label}
async function submitProfile(){if(state.busy)return;const n=normName(state.name);if(!n){document.getElementById('nickname').focus();toast('Indique ton prénom ou pseudo.',true);return}state.busy=true;const btn=document.getElementById('submit-profile');btn.disabled=true;btn.textContent='Un instant…';try{let code;if(state.view==='create'){code=await rpc('create_group',{p_session:sessionId,p_nickname:n,p_avatar:state.avatar});if(typeof code!=='string'||!/^\d{6}$/.test(code))throw Error('Réponse de création invalide')}else{code=state.code;await rpc('join_group',{p_code:code,p_session:sessionId,p_nickname:n,p_avatar:state.avatar})}state.code=code;state.busy=false;setUrl('g='+code);showLobby()}catch(e){state.busy=false;btn.disabled=false;btn.textContent=state.view==='create'?'Créer mon groupe':'Rejoindre ce groupe';toast('Impossible de valider : '+e.message,true)}}
function showJoin(){const full=state.entry.length===6;let h=`<main class="two-layout"><section class="panel left-panel join-panel"><div class="join-head"><h1 class="section-title">${state.invalid?'Aucun groupe trouvé !':'Entre le numéro du groupe'}</h1><p class="section-subtitle">Demande à l'initiateur du groupe</p></div><div><div class="slots" aria-label="Code du groupe">${Array.from({length:6},(_,i)=>`<div class="slot ${state.invalid?'bad':''} ${state.entry[i]?'entered':''}">${state.entry[i]||''}</div>`).join('')}</div><div class="join-alert ${state.checking?'info':''}">${state.checking?'Vérification du groupe…':esc(state.error)}</div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'','0','del'].map(n=>n===''?'<span></span>':n==='del'?`<button class="erase" onclick="pressKey('del')" aria-label="Effacer le dernier chiffre"><svg viewBox="0 0 36 30" stroke="currentColor" fill="none" stroke-width="2.5"><path d="M13 3H33V27H13L3 15Z" stroke-linejoin="round"/><path d="M17 10L27 20M27 10L17 20"/></svg></button>`:`<button class="sunbtn" onclick="pressKey('${n}')">${n}</button>`).join('')}</div></div></section><aside class="right-stage"><div class="right-content join-art">${state.invalid?peopleIllustration([6]):peopleIllustration([6,0,9,4])}</div></aside></main>`;shell(h)}
function pressKey(key){if(state.checking)return;if(key==='del')state.entry=state.entry.slice(0,-1);else if(state.entry.length>=6)state.entry=key;else state.entry+=key;state.invalid=false;state.error='';showJoin();if(state.entry.length===6)verifyCode()}
async function verifyCode(){const code=state.entry;if(!/^\d{6}$/.test(code)||state.checking)return;state.checking=true;state.error='';showJoin();let token=++requestSerial;try{const found=await rpc('check_group_code',{p_code:code});if(token!==requestSerial||state.view!=='join'||state.entry!==code)return;state.checking=false;if(found===true){state.code=code;const mine=await rpc('get_my_member_key',{p_code:code,p_session:sessionId});if(mine){setUrl('g='+code);showLobby();return}state.view='profile-join';state.name='';state.avatar=0;state.error='';showProfile()}else{state.invalid=true;showJoin()}}catch(e){state.checking=false;state.error='Connexion impossible. Réessaie.';showJoin()}}
function stopPoll(){if(poll){clearInterval(poll);poll=null}}
function showLobby(){stopPoll();state.view='lobby';state.loading=true;state.error='';state.members=[];state.myKey='';renderLobby();refreshLobby();poll=setInterval(()=>{if(state.view==='lobby')refreshLobby()},2500)}
async function refreshLobby(){const code=state.code;try{const [members,myKey]=await Promise.all([rpc('get_group_members',{p_code:code}),rpc('get_my_member_key',{p_code:code,p_session:sessionId})]);if(state.view!=='lobby'||code!==state.code)return;if(!myKey){stopPoll();state.view='profile-join';state.name='';state.avatar=0;showProfile();return}let fingerprint=JSON.stringify([members,myKey]);if(state.fingerprint!==fingerprint||state.loading||state.error){state.fingerprint=fingerprint;state.members=Array.isArray(members)?members:[];state.myKey=myKey;state.loading=false;state.error='';renderLobby()}}catch(e){if(state.view!=='lobby')return;state.loading=false;state.error='Mise à jour indisponible. Nouvelle tentative…';const errorEl=document.getElementById('lobby-error');if(errorEl)errorEl.textContent=state.error}}
function renderLobby(){let m=state.members||[],n=m.length,me=m.find(p=>p.member_key===state.myKey);const code=state.code,spaced=code.slice(0,3)+' '+code.slice(3);let ringClass=n>10?'people-ring grid':'people-ring';let people=m.map((p,i)=>{let x=50,y=50;if(n>1){let ang=2*Math.PI*i/n-Math.PI/2;let radius=n<=3?28:n<=6?34:38;x+=Math.cos(ang)*radius;y+=Math.sin(ang)*radius}else{y=45}let mine=p.member_key===state.myKey;return `<div class="person ${mine?'me':''}" style="left:${x}%;top:${y}%"><div style="position:relative">${avatarSVG(p.avatar_id,120)}${mine?'<span class="tag-me">Moi</span>':''}</div><strong title="${esc(p.nickname)}">${esc(p.nickname)}</strong></div>`}).join('');shell(`<main class="two-layout"><section class="panel left-panel lobby-panel"><h1 class="lobby-label">Numéro du groupe</h1><button class="code-button" onclick="copyCode()" title="Copier le numéro"><span class="room-code">${spaced}</span><svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button><p class="lobby-help">Les nouveaux participants peuvent rejoindre ton groupe en utilisant ce numéro.</p><div class="count"><span style="font-size:25px">♟</span><b>${n}</b> ${n>1?'participants':'participant'}</div><p id="lobby-error" class="error-block">${esc(state.error)}</p><div class="panel-bottom"><button class="sunbtn" onclick="shareGroup()">Partager le groupe</button></div></section><aside class="right-stage right-room"><div class="room-art"><div class="rings"></div><div class="${ringClass}">${people}</div>${n<2?'<div class="join-more">En attente de tes amis…</div>':''}</div></aside></main>`)}
async function copyValue(text){if(navigator.clipboard&&location.protocol==='https:'){await navigator.clipboard.writeText(text)}else{let t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=document.execCommand('copy');t.remove();if(!ok)throw Error('copie impossible')}}
async function copyCode(){try{await copyValue(state.code);toast('Numéro copié !')}catch{toast('Impossible de copier le numéro',true)}}
async function shareGroup(){let url=new URL(location.pathname,location.href);url.searchParams.set('join',state.code);url.hash='';let txt='Rejoins mon groupe vincent ! Code : '+state.code;if(location.protocol==='file:'){toast('Publie cette application pour partager un lien accessible.',true);return}if(navigator.share){try{await navigator.share({title:'vincent',text:txt,url:url.href});return}catch(e){if(e.name==='AbortError')return}}try{await copyValue(txt+' '+url.href);toast('Lien copié !')}catch{toast('Le lien ne peut pas être copié',true)}}
function resolveRoute(){let q=new URLSearchParams(location.search);let g=q.get('g'),j=q.get('join'),mode=q.get('mode');if(g&&/^\d{6}$/.test(g)){state.code=g;showLobby()}else if(j&&/^\d{6}$/.test(j))startJoin(j);else if(mode==='create'){state.view='create';state.name='';state.avatar=0;showProfile()}else if(mode==='join')startJoin();else showHome()}
window.addEventListener('popstate',resolveRoute);
window.addEventListener('keydown',e=>{if(state.view!=='join')return;if(e.key==='Backspace'){e.preventDefault();pressKey('del')}else if(/^\d$/.test(e.key)){e.preventDefault();pressKey(e.key)}});
window.addEventListener('paste',e=>{if(state.view!=='join')return;let digits=(e.clipboardData?.getData('text')||'').replace(/\D/g,'').slice(0,6);if(digits){state.entry=digits;state.invalid=false;state.error='';showJoin();if(digits.length===6)verifyCode()}});
resolveRoute();
</script>
